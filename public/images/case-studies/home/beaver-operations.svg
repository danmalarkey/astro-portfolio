<svg width="1600" height="960" viewBox="0 0 1600 960" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Seafood operations scheduler UI concept</title>
  <desc id="desc">A dark enterprise scheduler interface with timeline lanes, queue cards, and compact planning widgets.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="1520" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F3A4A"/>
      <stop offset="0.38" stop-color="#0B2738"/>
      <stop offset="0.72" stop-color="#0A1C2D"/>
      <stop offset="1" stop-color="#111923"/>
    </linearGradient>
    <radialGradient id="bloomA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(280 180) rotate(25) scale(560 280)">
      <stop stop-color="#4AB0D3" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4AB0D3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloomB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1380 820) rotate(220) scale(560 300)">
      <stop stop-color="#163746" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#163746" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="surface" x1="238" y1="122" x2="1378" y2="838" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10293A" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0A1E2E" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="laneBlock" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#6EC6E4" stop-opacity="0.62"/>
      <stop offset="0.55" stop-color="#5EAED3" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#4B89AE" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="accentWarm" x1="1" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#F7C45F" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#D89327" stop-opacity="0.78"/>
    </linearGradient>
    <filter id="soft" x="-120" y="-120" width="1840" height="1200" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1600" height="960" fill="url(#bg)"/>
  <rect width="1600" height="960" fill="url(#bloomA)"/>
  <rect width="1600" height="960" fill="url(#bloomB)"/>

  <!-- Main scheduler canvas -->
  <rect x="220" y="124" width="1160" height="712" rx="26" fill="url(#surface)" stroke="#7EB8CF" stroke-opacity="0.24" stroke-width="2"/>

  <!-- Header controls -->
  <rect x="256" y="160" width="1088" height="66" rx="13" fill="#123348" fill-opacity="0.82"/>
  <rect x="286" y="184" width="194" height="17" rx="8.5" fill="#A6D8E9" fill-opacity="0.5"/>
  <rect x="1006" y="178" width="94" height="30" rx="15" fill="#2C566F" fill-opacity="0.72"/>
  <rect x="1116" y="178" width="94" height="30" rx="15" fill="#2C566F" fill-opacity="0.62"/>
  <rect x="1226" y="178" width="94" height="30" rx="15" fill="url(#accentWarm)"/>

  <!-- Left mini calendar -->
  <rect x="256" y="248" width="256" height="552" rx="16" fill="#0E2434" fill-opacity="0.92" stroke="#7EB8CF" stroke-opacity="0.18"/>
  <rect x="278" y="272" width="212" height="26" rx="10" fill="#1A425A" fill-opacity="0.8"/>
  <g fill="#89C2D9" fill-opacity="0.72">
    <rect x="278" y="318" width="28" height="20" rx="6"/>
    <rect x="312" y="318" width="28" height="20" rx="6"/>
    <rect x="346" y="318" width="28" height="20" rx="6"/>
    <rect x="380" y="318" width="28" height="20" rx="6"/>
    <rect x="414" y="318" width="28" height="20" rx="6"/>
    <rect x="278" y="344" width="28" height="20" rx="6"/>
    <rect x="312" y="344" width="28" height="20" rx="6"/>
    <rect x="346" y="344" width="28" height="20" rx="6"/>
    <rect x="380" y="344" width="28" height="20" rx="6"/>
    <rect x="414" y="344" width="28" height="20" rx="6"/>
  </g>
  <rect x="278" y="392" width="212" height="1" fill="#88BDD2" fill-opacity="0.25"/>
  <rect x="278" y="420" width="170" height="18" rx="8" fill="#85C7DE" fill-opacity="0.34"/>
  <rect x="278" y="446" width="196" height="18" rx="8" fill="#85C7DE" fill-opacity="0.26"/>
  <rect x="278" y="472" width="154" height="18" rx="8" fill="#85C7DE" fill-opacity="0.22"/>
  <rect x="278" y="542" width="212" height="102" rx="12" fill="#12384E" fill-opacity="0.56"/>
  <rect x="296" y="564" width="88" height="14" rx="7" fill="#B3DFEE" fill-opacity="0.46"/>
  <rect x="296" y="588" width="176" height="10" rx="5" fill="#B3DFEE" fill-opacity="0.32"/>
  <rect x="296" y="606" width="148" height="10" rx="5" fill="#B3DFEE" fill-opacity="0.24"/>

  <!-- Main timeline grid -->
  <rect x="536" y="248" width="808" height="552" rx="16" fill="#0C2233" fill-opacity="0.84"/>
  <rect x="560" y="272" width="760" height="24" rx="10" fill="#0D3145" fill-opacity="0.86"/>
  <g stroke="#90C8DD" stroke-opacity="0.22" stroke-width="1">
    <line x1="622" y1="276" x2="622" y2="296"/>
    <line x1="718" y1="276" x2="718" y2="296"/>
    <line x1="814" y1="276" x2="814" y2="296"/>
    <line x1="910" y1="276" x2="910" y2="296"/>
    <line x1="1006" y1="276" x2="1006" y2="296"/>
    <line x1="1102" y1="276" x2="1102" y2="296"/>
    <line x1="1198" y1="276" x2="1198" y2="296"/>
    <line x1="1294" y1="276" x2="1294" y2="296"/>
  </g>

  <g>
    <rect x="560" y="322" width="760" height="70" rx="12" fill="#0E2B3E" fill-opacity="0.74"/>
    <rect x="560" y="404" width="760" height="70" rx="12" fill="#0E293A" fill-opacity="0.72"/>
    <rect x="560" y="486" width="760" height="70" rx="12" fill="#0E2737" fill-opacity="0.7"/>
    <rect x="560" y="568" width="760" height="70" rx="12" fill="#0E2635" fill-opacity="0.68"/>
    <rect x="560" y="650" width="760" height="70" rx="12" fill="#0E2432" fill-opacity="0.66"/>
  </g>

  <g stroke="#89C2D8" stroke-opacity="0.14" stroke-width="1">
    <line x1="658" y1="322" x2="658" y2="720"/>
    <line x1="756" y1="322" x2="756" y2="720"/>
    <line x1="854" y1="322" x2="854" y2="720"/>
    <line x1="952" y1="322" x2="952" y2="720"/>
    <line x1="1050" y1="322" x2="1050" y2="720"/>
    <line x1="1148" y1="322" x2="1148" y2="720"/>
    <line x1="1246" y1="322" x2="1246" y2="720"/>
  </g>

  <!-- Scheduled batches -->
  <g>
    <rect x="666" y="338" width="184" height="38" rx="9" fill="url(#laneBlock)"/>
    <rect x="882" y="338" width="152" height="38" rx="9" fill="url(#laneBlock)"/>
    <rect x="1060" y="338" width="226" height="38" rx="9" fill="url(#laneBlock)"/>

    <rect x="614" y="420" width="166" height="38" rx="9" fill="url(#laneBlock)"/>
    <rect x="814" y="420" width="216" height="38" rx="9" fill="url(#laneBlock)"/>
    <rect x="1064" y="420" width="172" height="38" rx="9" fill="url(#laneBlock)"/>

    <rect x="646" y="502" width="202" height="38" rx="9" fill="url(#laneBlock)"/>
    <rect x="878" y="502" width="168" height="38" rx="9" fill="url(#laneBlock)"/>
    <rect x="1070" y="502" width="198" height="38" rx="9" fill="url(#laneBlock)"/>

    <rect x="604" y="584" width="192" height="38" rx="9" fill="url(#laneBlock)"/>
    <rect x="826" y="584" width="236" height="38" rx="9" fill="url(#laneBlock)"/>
    <rect x="1090" y="584" width="166" height="38" rx="9" fill="url(#laneBlock)"/>

    <rect x="658" y="666" width="226" height="38" rx="9" fill="url(#laneBlock)"/>
    <rect x="916" y="666" width="192" height="38" rx="9" fill="url(#laneBlock)"/>
    <rect x="1134" y="666" width="136" height="38" rx="9" fill="url(#laneBlock)"/>
  </g>

  <!-- subtle atmospheric glow -->
  <g filter="url(#soft)" opacity="0.22">
    <ellipse cx="298" cy="180" rx="92" ry="44" fill="#5CB9DC"/>
    <ellipse cx="1320" cy="210" rx="116" ry="52" fill="#4EA5C7"/>
    <ellipse cx="1246" cy="812" rx="168" ry="72" fill="#1E4D66"/>
  </g>
</svg>
